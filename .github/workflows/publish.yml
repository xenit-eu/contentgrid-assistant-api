name: Publish Python distributions to PyPI

on:
  release:
    types: [published]

jobs:
  publish-to-pypi:
    name: Publish to PyPi
    runs-on: ubuntu-latest
    strategy:
      matrix:
        client:
          - name: contentgrid_assistant_api
            pypi_name: contentgrid-assistant-api

    environment:
      name: pypi
      url: https://pypi.org/p/${{ matrix.client.pypi_name }}
    
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install build requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Build a binary wheel and a source tarball
        working-directory: ${{ matrix.client.name }}
        run: python3 -m build
      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: ${{ matrix.client.name }}/dist