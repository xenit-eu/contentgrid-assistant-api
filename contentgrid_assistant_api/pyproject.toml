[build-system]
requires = ["setuptools>=61.0.0", "wheel", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "contentgrid-assistant-api"
dynamic = ["version"]
description = "FastAPI wrapper for contentgrid assistants"
readme = "README.md"
authors = [{ name = "Ranec Belpaire", email = "ranec.belpaire@xenit.eu" }]
license = { file = "LICENSE" }

classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
]

dependencies = [
    "fastapi >= 0.137.2",
    "openai >= 2.7.2",
    "pydantic >= 2.11.9, < 3",
    "pydantic-settings >= 2.12.0",
    "langchain >= 1.2.3",
    "langchain_openai >= 1.1.7",
    "langgraph >= 1.0.5",
    "langgraph-checkpoint-postgres >= 3.0.2",
    "langfuse >= 3.0.0",
    "sqlalchemy >= 2.0.45",
    "psycopg[binary] >= 3.3.2",
    "contentgrid_extension_helpers >= 0.0.7",
    "sqlmodel >= 0.0.31, < 0.0.45",
    "python-multipart >= 0.0.21",
]

requires-python = ">=3.10"

[project.urls]
Homepage = "https://github.com/xenit-eu/contentgrid-assistant-api"
Source = "https://github.com/xenit-eu/contentgrid-assistant-api"

[tool.setuptools_scm]
write_to = "_version.txt"
root = "../"