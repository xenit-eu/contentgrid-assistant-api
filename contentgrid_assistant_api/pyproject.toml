[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "contentgrid-assistant-api"
version = "0.1.0"
description = "FastAPI wrapper for contentgrid assistants"
readme = "README.md"
authors = [{ name = "Ranec Belpaire", email = "ranec.belpaire@xenit.eu" }]
license = { file = "LICENSE" }
 
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
]

dependencies = [
    "fastapi >= 0.124.0",
    "openai >= 2.7.2",
    "pydantic >= 2.11.9, < 3",
    "pydantic-settings >= 2.12.0",
    "langchain >= 1.2.3",
    "langchain_openai >= 1.1.7",
    "langgraph >= 1.0.5",
    "langgraph-checkpoint-postgres >= 3.0.2",
    "python-dotenv >= 1.1.1",
    "requests >= 2.32.5, < 3",
    "types-requests >= 2.32.4",
    "uri-template >= 1.3.0, < 2",
    "sqlalchemy >= 2.0.45",
    "psycopg[binary] >= 3.3.2",
    "contentgrid_extension_helpers >= 0.0.3",
    "sqlmodel >= 0.0.31",
    "python-multipart >= 0.0.21",
]

requires-python = ">=3.5"

[tool.setuptools_scm]
write_to = "_version.txt"
root = "../"